name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Per-ref, so a pull request run never cancels an in-flight deploy of main.
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Same floor as the build job below: package.json engines.
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      # Report type errors even when the tests failed, so one run shows both.
      - run: npx astro check
        if: ${{ !cancelled() }}
  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6
        with:
          # v6 defaults to Node 24; package.json engines requires >=22.12.0
          # (Astro 7). Pinned to the declared floor: if it builds here, it
          # builds on newer Node too.
          node-version: "22"
  deploy:
    needs: build
    # A pull request stops after check and build; only main publishes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
